[versions]
agp = "9.5.1"
kotlin = "2.2.10"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2024.09.00"
hilt = "2.60.1"
