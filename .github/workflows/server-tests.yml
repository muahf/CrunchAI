name: Server tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  JWT_SECRET: ci-secret-not-for-production-0123456789abcdef
  FIREBASE_PROJECT: crunchai-c91e2
  USE_EMULATOR: "1"

jobs:
  unit-and-api-tests:
    name: pytest (unit и API-тесты)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Установка зависимостей
        run: |
          pip install -r server/requirements.txt pytest httpx
          npm install -g firebase-tools
      - name: Запуск pytest вместе с эмулятором Firestore
        working-directory: server
        run: firebase emulators:exec --only firestore --project crunchai-c91e2 "python -m pytest test -v"

  postman-tests:
    name: Postman (newman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Установка зависимостей
        run: |
          pip install -r server/requirements.txt
          npm install -g firebase-tools newman
      - name: Запуск сервера и коллекции Postman
        working-directory: server
        run: firebase emulators:exec --only firestore --project crunchai-c91e2 "bash ci/run_postman.sh"
